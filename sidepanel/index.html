<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGPT Automation</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <span data-i18n="appTitle">ChatGPT Automation</span>
    </div>
    <span class="status-pill" id="runnerStatus"></span>
  </header>

  <nav class="pagetabs" role="tablist">
    <button role="tab" id="tabControl" data-page="control" data-i18n="tabControl">Control</button>
    <button role="tab" id="tabSetting" data-page="setting" data-i18n="tabSetting">Setting</button>
  </nav>

  <!-- ===================== Control ===================== -->
  <main id="page-control" class="page">
    <section class="card">
      <h2 data-i18n="modeHeading">Mode</h2>
      <div class="modes" role="tablist" id="modeTabs">
        <button role="tab" data-mode="text" data-i18n="mode_text">Text Processing</button>
        <button role="tab" data-mode="ingredients" data-i18n="mode_ingredients">Ingredients to Text</button>
        <button role="tab" data-mode="textToImage" data-i18n="mode_textToImage">Text to Image</button>
        <button role="tab" data-mode="imageToImage" data-i18n="mode_imageToImage">Image to Image</button>
      </div>
      <p class="hint" id="modeHint"></p>

      <div class="assets" id="assetsBox" hidden>
        <div class="assets-head">
          <strong id="assetsTitle"></strong>
          <label class="btn small"><input type="file" id="assetInput" accept="image/*" multiple hidden /><span data-i18n="uploadImages">Upload images</span></label>
          <button class="btn small ghost" id="clearAssets" data-i18n="clear">Clear</button>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <label class="check"><input type="checkbox" data-setting="autoAddCharacters" /> <span data-i18n="autoAddCharacters">Auto-add character images</span></label>
        <p class="hint" data-i18n="autoAddCharactersHint"></p>
      </div>

      <label class="field" id="aspectField"><span data-i18n="aspectRatio">Aspect ratio</span>
        <select data-setting="aspectRatio">
          <option value="" data-i18n="aspectNone">Don't specify</option>
          <option value="1:1">1:1</option>
          <option value="16:9">16:9</option>
          <option value="9:16">9:16</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="promptsHeading">Prompts</h2>
      <textarea id="promptInput" rows="7" data-i18n-placeholder="promptsPlaceholder"></textarea>
      <div class="row between">
        <label class="linkbtn"><input type="file" id="importFile" accept=".txt,.csv,.md,text/plain,text/csv" hidden /><span data-i18n="uploadTxt">or upload .txt file</span></label>
        <span class="hint" id="promptCount"></span>
      </div>
    </section>

    <section class="card">
      <div class="grid">
        <label class="field"><span data-i18n="concurrency">Concurrent Prompts</span><input type="number" min="1" max="6" step="1" data-setting="concurrency" /></label>
        <label class="field"><span data-i18n="promptDelay">Prompt Delay (s)</span>
          <span class="range"><input type="number" min="0" step="1" data-setting="minDelay" aria-label="min" /><span>–</span><input type="number" min="0" step="1" data-setting="maxDelay" aria-label="max" /></span>
        </label>
        <label class="field"><span data-i18n="saveToFolder">Save to Folder</span><input type="text" data-setting="folder" /></label>
        <label class="check end"><input type="checkbox" data-setting="renameFiles" /> <span data-i18n="autoRename">Auto Change File Name</span></label>
      </div>
      <p class="hint mono" id="filenamePreview"></p>

      <div class="row run">
        <button class="btn primary" id="runBtn" data-i18n="run">Run</button>
        <button class="btn danger" id="stopBtn" data-i18n="stop">Stop</button>
        <button class="btn" id="fixBtn" data-i18n="fixError">Fix Error</button>
      </div>
      <div class="row bg">
        <button class="btn small ghost" id="bgBtn" data-i18n="enableBackground">Enable background mode</button>
        <span class="badge" id="bgBadge" hidden><span data-i18n="runningInBackground">Running in background</span> <button class="icon-btn" id="bgOff" aria-label="Stop background mode">✕</button></span>
      </div>
      <p class="hint" data-i18n="backgroundHint"></p>
    </section>

    <section class="card">
      <div class="queue-head">
        <h2 data-i18n="queueHeading">Queue</h2>
        <span class="counts" id="counts"></span>
      </div>
      <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
      <div class="row wrap">
        <button class="btn small ghost" id="retryFailedBtn" data-i18n="retryFailed">Retry failed</button>
        <button class="btn small ghost" id="resetBtn" data-i18n="resetAll">Run all again</button>
        <button class="btn small ghost" id="clearBtn" data-i18n="clearQueue">Clear queue</button>
      </div>
      <ol class="queue" id="queueList"></ol>
      <p class="empty" id="queueEmpty" data-i18n="queueEmpty">No prompts yet.</p>
      <p class="hint" data-i18n="keepPanelOpen"></p>
    </section>

    <details class="card" id="logCard">
      <summary><h2 data-i18n="logHeading">Activity log</h2></summary>
      <div class="row">
        <button class="btn small ghost" id="copyDiagnosticsBtn" data-i18n="copyDiagnostics">Copy diagnostics</button>
      </div>
      <p class="hint" data-i18n="copyDiagnosticsHint"></p>
      <ul class="log" id="log"></ul>
    </details>
  </main>

  <!-- ===================== Setting ===================== -->
  <main id="page-setting" class="page" hidden>
    <section class="card settings">
      <label class="field"><span data-i18n="language">Language</span><select id="language"></select></label>
      <label class="field"><span data-i18n="defaultMode">Default Mode</span>
        <select data-setting="defaultMode">
          <option value="text" data-i18n="mode_text">Text Processing</option>
          <option value="ingredients" data-i18n="mode_ingredients">Ingredients to Text</option>
          <option value="textToImage" data-i18n="mode_textToImage">Text to Image</option>
          <option value="imageToImage" data-i18n="mode_imageToImage">Image to Image</option>
        </select>
      </label>
      <div class="grid">
        <label class="field"><span data-i18n="textOutputs">Outputs per Prompt (Text)</span><input type="number" min="1" max="4" step="1" data-setting="textOutputs" /></label>
        <label class="field"><span data-i18n="imageOutputs">Outputs per Prompt (Image)</span><input type="number" min="1" max="50" step="1" data-setting="imageOutputs" /></label>
        <label class="field"><span data-i18n="concurrency">Concurrent Prompts</span><input type="number" min="1" max="6" step="1" data-setting="concurrency" /></label>
        <label class="field"><span data-i18n="randomDelay">Random Delay (s)</span>
          <span class="range"><input type="number" min="0" step="1" data-setting="minDelay" aria-label="min" /><span>–</span><input type="number" min="0" step="1" data-setting="maxDelay" aria-label="max" /></span>
        </label>
      </div>
      <label class="field"><span data-i18n="textModel">Text Model</span><input type="text" list="modelList" data-setting="textModel" data-i18n-placeholder="modelDefault" /></label>
      <label class="field"><span data-i18n="imageModel">Image Model</span><input type="text" list="modelList" data-setting="imageModel" data-i18n-placeholder="modelDefault" /></label>
      <p class="hint" data-i18n="modelHint"></p>
      <datalist id="modelList">
        <option value="auto"></option>
        <option value="gpt-5"></option>
        <option value="gpt-5-thinking"></option>
        <option value="gpt-5-instant"></option>
        <option value="gpt-4o"></option>
        <option value="gpt-4-1"></option>
        <option value="o3"></option>
      </datalist>
      <div class="grid">
        <label class="field"><span data-i18n="defaultPromptMode">Default Prompt Mode Option</span>
          <select data-setting="defaultPromptMode">
            <option value="new" data-i18n="chatMode_new">New Chat</option>
            <option value="concat" data-i18n="chatMode_concat">Concat</option>
          </select>
        </label>
        <label class="field"><span data-i18n="defaultImageMode">Default Image Mode Option</span>
          <select data-setting="defaultImageMode">
            <option value="new" data-i18n="imageMode_new">New Image</option>
            <option value="last" data-i18n="imageMode_last">Last Image</option>
          </select>
        </label>
      </div>
      <p class="hint" data-i18n="promptModeHint"></p>
      <div class="grid">
        <label class="field"><span data-i18n="maxIngredientImages">Max Input Images per Prompt (Ingredients)</span><input type="number" min="1" max="3" step="1" data-setting="maxIngredientImages" /></label>
        <label class="field"><span data-i18n="maxImageInputs">Max Input Images per Prompt (Image to Image)</span><input type="number" min="1" max="10" step="1" data-setting="maxImageInputs" /></label>
        <label class="field"><span data-i18n="maxRetries">Max Retries on Failure</span><input type="number" min="1" max="20" step="1" data-setting="maxRetries" /></label>
        <label class="field"><span data-i18n="timeoutMinutes">Timeout per Prompt (min)</span><input type="number" min="1" max="60" step="1" data-setting="timeoutMinutes" /></label>
        <label class="field"><span data-i18n="textDownload">Auto Download (Text)</span>
          <select data-setting="textDownload">
            <option value="none" data-i18n="noDownload">No Download</option>
            <option value="md" data-i18n="downloadMd">Markdown (.md)</option>
            <option value="txt" data-i18n="downloadTxt">Plain text (.txt)</option>
          </select>
        </label>
        <label class="field"><span data-i18n="imageDownload">Auto Download Quality (Image)</span>
          <select data-setting="imageDownload">
            <option value="none" data-i18n="noDownload">No Download</option>
            <option value="original" data-i18n="downloadOriginal">Original (1k)</option>
          </select>
        </label>
      </div>
      <label class="check"><input type="checkbox" data-setting="keepTabActive" /> <span data-i18n="keepTabActive">Keep the ChatGPT tab in front while running</span></label>
      <p class="hint" data-i18n="keepTabActiveHint"></p>
    </section>
  </main>

  <template id="queueItemTpl">
    <li class="qi">
      <div class="qi-main">
        <span class="qi-num"></span>
        <span class="qi-prompt"></span>
      </div>
      <div class="qi-meta">
        <span class="chip status"></span>
        <span class="tag qi-mode"></span>
        <button class="tag toggle qi-option"></button>
        <span class="qi-extra"></span>
        <span class="spacer"></span>
        <a class="qi-link" target="_blank" rel="noopener" data-i18n="openChat" hidden>Open chat</a>
        <button class="icon-btn qi-rerun" data-i18n-title="rerun" aria-label="Re-run">↻</button>
        <button class="icon-btn qi-remove" data-i18n-title="remove" aria-label="Remove">✕</button>
      </div>
      <p class="qi-error" hidden></p>
    </li>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
